name: easyeats

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB em infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER em infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em infra/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [easyeats_net]

  backend:
    image: zacml/easy-eats-api:1.0
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Defina POSTGRES_DB em infra/.env}
      DB_USER: ${POSTGRES_USER:?Defina POSTGRES_USER em infra/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em infra/.env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET em infra/.env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS em infra/.env (exemplo http://localhost:4200)}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [easyeats_net]

  frontend:
    image: zacml/easy-eats-web:1.0
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
      additional_contexts:
        infra: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks: [easyeats_net]

networks:
  easyeats_net:

volumes:
  db_data:
